[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-comment-crawler"
version = "1.0.0"
description = "A conservative Playwright crawler for first-level Douyin comments and comment images."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openpyxl>=3.1,<4",
  "Pillow>=10,<13",
  "playwright>=1.50,<2",
]

[project.optional-dependencies]
licensing = ["customtkinter>=5.2,<6", "cryptography>=43,<52"]

[project.scripts]
douyin-activation = "activation_window:main"
douyin-web = "web_console:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "activation_window",
  "offline_license",
  "browser_session",
  "private_chat",
  "private_chat_batch",
  "comments",
  "crawler",
  "export_comments_excel",
  "output",
  "web_console",
]
