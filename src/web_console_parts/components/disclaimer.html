<div id="disclaimerDialog" class="dialog-backdrop show" role="presentation" aria-hidden="false">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="disclaimerTitle"
             aria-describedby="disclaimerCopy">
        <h2 id="disclaimerTitle">使用须知与免责声明</h2>
        <div id="disclaimerCopy" class="disclaimer-copy">
            <p>
                本工具仅用于你有权访问的公开评论调研。使用前请遵守适用法律、平台规则，并尊重用户隐私与他人权益；不要绕过访问限制或将采集结果用于骚扰、垃圾私信等用途。</p>
            <p>
                评论、图片及用户资料可能不完整、延迟或变化；平台可能限制访问。请自行核对数据与私信结果，并审慎决定采集、保存、使用和分享的范围。</p>
            <p>
                继续使用表示你了解上述风险并自行负责具体使用行为。若不同意，请关闭页面并退出程序。首次确认后会保存在本机，以后启动无需重复确认。</p>
        </div>
        <label class="disclaimer-consent" for="disclaimerCheckbox"><input id="disclaimerCheckbox" type="checkbox"><span>我已阅读并理解上述使用须知</span></label>
        <p id="disclaimerError" class="dialog-error" role="alert" hidden></p>
        <div class="dialog-actions">
            <button id="confirmDisclaimer" class="btn primary" type="button" disabled>确认并进入工作台</button>
        </div>
    </section>
</div>
